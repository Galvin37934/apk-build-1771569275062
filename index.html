<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iCamera AI - Fix Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { 
            background: #000; 
            color: #fff; 
            overflow: hidden; 
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .glass {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .shutter-btn {
            width: 80px;
            height: 80px;
            border: 4px solid #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }

        .shutter-inner {
            width: 64px;
            height: 64px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.1s;
        }

        .shutter-btn:active .shutter-inner {
            transform: scale(0.9);
        }

        .focus-box {
            position: absolute;
            width: 80px;
            height: 80px;
            border: 1.5px solid #FFD60A;
            pointer-events: none;
            z-index: 40;
        }

        /* EV Slider vertical di samping kotak fokus */
        .ev-line {
            position: absolute;
            left: 95px;
            top: 50%;
            transform: translateY(-50%);
            width: 2px;
            height: 100px;
            background: rgba(255, 214, 10, 0.3);
        }

        .ev-sun {
            position: absolute;
            left: -8px;
            color: #FFD60A;
        }

        /* AI Scan effect */
        .scanline {
            width: 100%;
            height: 4px;
            background: #3b82f6;
            position: absolute;
            z-index: 100;
            box-shadow: 0 0 20px #3b82f6;
            animation: scan 2s linear infinite;
        }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        .safe-top { padding-top: env(safe-area-inset-top); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [zoom, setZoom] = useState(1);
            const [ev, setEv] = useState(0);
            const [flash, setFlash] = useState(false);
            const [focusPos, setFocusPos] = useState(null);
            const [isProcessing, setIsProcessing] = useState(false);
            const [enhancedImg, setEnhancedImg] = useState(null);
            const [errorMsg, setErrorMsg] = useState(null);

            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const trackRef = useRef(null);
            const lastY = useRef(0);
            
            const apiKey = ""; // Diset otomatis

            useEffect(() => {
                initCamera();
                return () => { if(trackRef.current) trackRef.current.stop(); };
            }, []);

            const initCamera = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment', width: { ideal: 3840 }, height: { ideal: 2160 } },
                        audio: false
                    });
                    if (videoRef.current) {
                        videoRef.current.srcObject = stream;
                        trackRef.current = stream.getVideoTracks()[0];
                    }
                } catch (err) {
                    setErrorMsg("Kamera gagal dibuka.");
                }
            };

            // Update Hardware (Flash & EV)
            useEffect(() => {
                if (trackRef.current) {
                    trackRef.current.applyConstraints({
                        advanced: [{ torch: flash, exposureCompensation: ev }]
                    }).catch(() => {});
                }
            }, [flash, ev]);

            const handleTouchStart = (e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const x = e.touches[0].clientX - rect.left;
                const y = e.touches[0].clientY - rect.top;
                setFocusPos({ x, y });
                lastY.current = e.touches[0].clientY;
                
                // Hapus kotak fokus setelah 4 detik
                setTimeout(() => setFocusPos(null), 4000);
            };

            const handleTouchMove = (e) => {
                if (!focusPos) return;
                const currentY = e.touches[0].clientY;
                const diff = lastY.current - currentY;
                
                // Sensitivitas geser untuk EV
                setEv(prev => {
                    const next = prev + (diff * 0.02);
                    return Math.max(-2, Math.min(2, next));
                });
                lastY.current = currentY;
            };

            const capture = async () => {
                if (isProcessing) return;
                
                const video = videoRef.current;
                const canvas = canvasRef.current;
                if (!video || !canvas) return;

                const ctx = canvas.getContext('2d');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                // Zoom Crop Logic
                const sw = video.videoWidth / zoom;
                const sh = video.videoHeight / video.videoWidth * sw;
                const sx = (video.videoWidth - sw) / 2;
                const sy = (video.videoHeight - sh) / 2;

                // Simulasi brightness sesuai EV
                ctx.filter = `brightness(${1 + (ev * 0.2)})`;
                ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
                
                const base64Data = canvas.toDataURL('image/png').split(',')[1];
                setIsProcessing(true);
                setErrorMsg(null);

                try {
                    // Gunakan gemini-2.5-flash-image-preview untuk image-to-image
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image-preview:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: "Tolong perjelas foto zoom ini. Hilangkan noise dan rekonstruksi detailnya agar tajam dan natural. Kembalikan hanya gambar hasilnya." },
                                    { inlineData: { mimeType: "image/png", data: base64Data } }
                                ]
                            }],
                            generationConfig: { responseModalities: ['TEXT', 'IMAGE'] }
                        })
                    });

                    const result = await response.json();
                    
                    // Ekstrak data gambar dari respon
                    const enhancedBase64 = result.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
                    
                    if (enhancedBase64) {
                        setEnhancedImg(`data:image/png;base64,${enhancedBase64}`);
                    } else {
                        throw new Error("AI tidak mengirimkan gambar.");
                    }
                } catch (err) {
                    setErrorMsg("Gagal memproses gambar. Coba lagi.");
                    setTimeout(() => setErrorMsg(null), 3000);
                } finally {
                    setIsProcessing(false);
                }
            };

            return (
                <div className="h-screen w-screen flex flex-col bg-black relative select-none">
                    
                    {/* Viewfinder Section */}
                    <div 
                        className="flex-1 relative overflow-hidden"
                        onTouchStart={handleTouchStart}
                        onTouchMove={handleTouchMove}
                    >
                        <video 
                            ref={videoRef} autoPlay playsInline muted 
                            className="absolute w-full h-full object-cover"
                            style={{ transform: `scale(${zoom})`, filter: `brightness(${1 + (ev * 0.1)})` }}
                        />

                        {/* Focus Box & Vertical EV UI */}
                        {focusPos && (
                            <div 
                                className="focus-box"
                                style={{ top: focusPos.y - 40, left: focusPos.x - 40 }}
                            >
                                <div className="ev-line">
                                    <div 
                                        className="ev-sun" 
                                        style={{ bottom: `${((ev + 2) / 4) * 100}%` }}
                                    >
                                        <i data-lucide="sun" size={18}></i>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Grid */}
                        <div className="absolute inset-0 pointer-events-none opacity-20 flex">
                            <div className="flex-1 border-r border-white/40"></div>
                            <div className="flex-1 border-r border-white/40"></div>
                            <div className="flex-1"></div>
                            <div className="absolute inset-0 flex flex-col">
                                <div className="flex-1 border-b border-white/40"></div>
                                <div className="flex-1 border-b border-white/40"></div>
                                <div className="flex-1"></div>
                            </div>
                        </div>

                        {/* Processing Effect */}
                        {isProcessing && (
                            <div className="absolute inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center">
                                <div className="scanline"></div>
                                <p className="text-blue-400 font-bold tracking-[0.5em] uppercase text-[10px] animate-pulse">Neural Enhancing</p>
                            </div>
                        )}
                    </div>

                    {/* Top UI */}
                    <div className="absolute top-0 w-full z-40 safe-top px-6 py-4 flex justify-between items-center bg-gradient-to-b from-black/80 to-transparent">
                        <button onClick={() => setFlash(!flash)} className={flash ? "text-yellow-400" : "text-white"}>
                            <i data-lucide={flash ? "zap" : "zap-off"} size={24}></i>
                        </button>
                        <div className="flex items-center gap-2">
                             <div className="w-1.5 h-1.5 rounded-full bg-green-500"></div>
                             <span className="text-[10px] font-bold tracking-widest text-white/60 uppercase">Live AI Mode</span>
                        </div>
                        <div className="w-6"></div>
                    </div>

                    {/* Bottom Control Section */}
                    <div className="glass safe-bottom flex flex-col items-center">
                        
                        {/* Zoom Pills */}
                        <div className="w-full flex justify-center gap-6 pt-6 pb-2 text-[12px] font-bold text-white/50">
                            {[1, 2, 5, 10, 20].map(z => (
                                <button 
                                    key={z} 
                                    onClick={() => setZoom(z)} 
                                    className={`transition-all ${zoom === z ? "text-yellow-400 scale-125 font-black" : ""}`}
                                >
                                    {z}×
                                </button>
                            ))}
                        </div>

                        <div className="py-4">
                            <span className="text-yellow-400 font-bold tracking-[0.2em] text-[11px] uppercase border-b-2 border-yellow-400 pb-1">Photo</span>
                        </div>

                        {/* Action Bar */}
                        <div className="w-full flex justify-around items-center px-10 pb-10">
                            <div className="w-12 h-12 bg-white/5 rounded-xl border border-white/10 overflow-hidden">
                                {enhancedImg && <img src={enhancedImg} className="w-full h-full object-cover" />}
                            </div>
                            
                            <button onClick={capture} className="shutter-btn active:scale-95 transition-transform">
                                <div className="shutter-inner"></div>
                            </button>

                            <button onClick={() => initCamera()} className="w-12 h-12 flex items-center justify-center bg-white/5 rounded-full border border-white/10">
                                <i data-lucide="refresh-cw" size={20}></i>
                            </button>
                        </div>
                    </div>

                    {/* Fullscreen Result Modal */}
                    {enhancedImg && (
                        <div className="fixed inset-0 z-[100] bg-black flex flex-col animate-in fade-in zoom-in-95 duration-300">
                            <div className="flex justify-between items-center p-6 pt-safe">
                                <span className="text-[10px] font-black tracking-widest text-blue-400 uppercase">AI RECONSTRUCTED</span>
                                <button onClick={() => setEnhancedImg(null)} className="p-2 bg-white/10 rounded-full"><i data-lucide="x" size={20}></i></button>
                            </div>
                            <div className="flex-1 p-4 flex items-center justify-center overflow-hidden">
                                <img src={enhancedImg} className="max-w-full max-h-full rounded-2xl shadow-2xl object-contain" />
                            </div>
                            <div className="p-8 pb-safe-bottom">
                                <button className="w-full bg-blue-600 py-4 rounded-2xl font-black text-sm active:scale-95 transition-transform shadow-lg shadow-blue-900/40">
                                    SIMPAN FOTO
                                </button>
                            </div>
                        </div>
                    )}

                    {errorMsg && (
                        <div className="fixed top-20 left-1/2 -translate-x-1/2 bg-red-600/90 px-6 py-2 rounded-full text-[10px] font-bold z-[200]">
                            {errorMsg.toUpperCase()}
                        </div>
                    )}

                    <canvas ref={canvasRef} className="hidden" />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        setTimeout(() => { if(window.lucide) window.lucide.createIcons(); }, 300);
    </script>
</body>
</html>
